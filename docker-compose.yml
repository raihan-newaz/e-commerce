services:
  ecommerce:
    build: .
    container_name: nix-ecommerce
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: ${ECOMMERCE_MEMORY_LIMIT:-1536m}
    cpus: ${ECOMMERCE_CPUS:-2.5}
    pids_limit: 512
    network_mode: host
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      API_HOST: 127.0.0.1
      PORT: ${ECOMMERCE_PORT:-3010}
      NODE_OPTIONS: --max-old-space-size=1024
      WEBP_QUALITY: ${WEBP_QUALITY:-82}
      WEBP_MAX_DIMENSION: ${WEBP_MAX_DIMENSION:-2560}
    volumes:
      - ./server/uploads:/app/server/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
